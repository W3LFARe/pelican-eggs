name: Validate Pelican Eggs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly: catches upstream repos/URLs going away even when this repo is quiet.
    - cron: '17 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate eggs (schema, CRLF, bash -n, generator is up to date)
        run: python3 scripts/validate_eggs.py

      - name: Verify download URLs resolve (icons, update_url, upstream launch.sh/pack.env)
        if: github.event_name != 'pull_request'
        run: python3 scripts/validate_eggs.py --check-urls
